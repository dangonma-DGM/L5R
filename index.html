<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <link href="images/icono.png" type="image/x-icon" rel="shortcut icon" />
  <title>Leyenda de los Cinco Anillos - Mesa de Juego</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      min-height: 100vh;
      background-color: black;
      background-image: url('images/bg.jpg');
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      font-family: "Lucida Sans Unicode", "Lucida Grande", sans-serif;
      font-size: 12px;
      line-height: 20px;
      color: #fff;
    }

    /* --- Menú Lateral Izquierdo --- */
    .sidebar {
      width: 240px;
      background: rgba(15, 15, 15, 0.95);
      border-right: 2px solid rgba(197, 160, 89, 0.4);
      display: flex;
      flex-direction: column;
      padding: 25px 15px;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.8);
      z-index: 100;
      flex-shrink: 0;
    }

    .sidebar-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .sidebar-header img {
      width: 150px;
      max-width: 100%;
      height: auto;
      filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.7));
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-group-title {
      color: #c5a059;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 12px 0 4px 5px;
      font-weight: bold;
      border-bottom: 1px solid rgba(197, 160, 89, 0.2);
      padding-bottom: 3px;
    }

    .nav-btn {
      background: rgba(40, 40, 40, 0.6);
      color: #e0d8c3;
      border: 1px solid rgba(197, 160, 89, 0.3);
      padding: 10px 15px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      cursor: pointer;
      text-align: left;
      border-radius: 4px;
      transition: all 0.3s ease;
      font-weight: bold;
    }

    .nav-btn:hover {
      background: rgba(197, 160, 89, 0.2);
      border-color: #c5a059;
      color: #fff;
    }

    .nav-btn.active {
      background: rgba(197, 160, 89, 0.35);
      border-color: #c5a059;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
    }

    /* --- Área Principal --- */
    .main-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 25px;
      position: relative;
      overflow-y: auto;
    }

    .page-section {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    .page-section.active {
      display: flex;
    }

    /* --- PANEL DE DADOS COMÚN (MESA GENERAL) --- */
    .table-title {
      text-align: center;
      color: #c5a059;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      border-bottom: 2px solid rgba(197, 160, 89, 0.4);
      padding-bottom: 10px;
      width: 100%;
      max-width: 1300px;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1400px;
      margin-bottom: 30px;
    }

    .player-card {
      background: rgba(15, 15, 15, 0.9);
      border: 1px solid rgba(197, 160, 89, 0.5);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
    }

    .player-card.master-card {
      border: 1px solid rgba(255, 85, 85, 0.8);
      box-shadow: 0 8px 25px rgba(255, 0, 0, 0.2);
    }

    .player-card.master-card .player-name {
      color: #ff5555;
    }

    .player-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid #c5a059;
      object-fit: cover;
      object-position: center top;
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.3);
      background: rgba(30, 30, 30, 0.8);
    }

    .player-card.master-card .player-avatar {
      border-color: #ff5555;
      box-shadow: 0 0 10px rgba(255, 85, 85, 0.4);
    }

    .player-name {
      color: #c5a059;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Lanzador dentro de la carta del jugador */
    .dice-roller-box {
      width: 100%;
      background: rgba(25, 25, 25, 0.9);
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dice-inputs {
      display: flex;
      gap: 10px;
      justify-content: space-around;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .input-group label {
      font-size: 10px;
      color: #aaa;
      text-transform: uppercase;
    }

    .dice-input {
      width: 50px;
      background: #111;
      border: 1px solid #c5a059;
      color: #fff;
      text-align: center;
      padding: 5px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      outline: none;
    }

    .roll-btn {
      background: linear-gradient(180deg, #c5a059 0%, #8a6d33 100%);
      color: #000;
      border: none;
      padding: 8px;
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .roll-btn:hover {
      filter: brightness(1.2);
    }

    .dice-result-total {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #c5a059;
      padding: 8px;
      border-radius: 4px;
    }

    .dice-result-total .total-number {
      font-size: 26px;
      font-weight: bold;
      color: #55ff55;
      line-height: 1.1;
    }

    .dice-history {
      max-height: 120px;
      overflow-y: auto;
      background: rgba(10, 10, 10, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 8px;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
    }

    .history-entry {
      border-bottom: 1px dotted rgba(255, 255, 255, 0.15);
      padding-bottom: 3px;
    }

    .history-entry .kept-dice {
      color: #c5a059;
      font-weight: bold;
    }

    .history-entry .exploded {
      color: #ff5555;
    }

    /* --- Plantilla Individual de Personaje --- */
    .character-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 1000px;
      background: rgba(15, 15, 15, 0.88);
      border: 1px solid rgba(197, 160, 89, 0.5);
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
    }

    .char-title {
      grid-column: 1 / -1;
      color: #c5a059;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      border-bottom: 1px solid rgba(197, 160, 89, 0.3);
      padding-bottom: 10px;
    }

    .char-gallery {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .char-img-wrapper {
      width: 50%;
      height: 250px;
      border: 1px solid rgba(197, 160, 89, 0.4);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(10, 10, 10, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
    }

    .char-textarea {
      width: 100%;
      height: 250px;
      background: rgba(25, 25, 25, 0.9);
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 4px;
      padding: 12px;
      color: #e0d8c3;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    .char-textarea:focus {
      border-color: #c5a059;
    }

    /* --- Notas --- */
    .notes-container {
      width: 100%;
      max-width: 800px;
      height: 75vh;
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid rgba(197, 160, 89, 0.5);
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .notes-container h2 {
      color: #c5a059;
      font-size: 20px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }

    .notes-textarea {
      flex: 1;
      background: rgba(25, 25, 25, 0.9);
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 4px;
      padding: 20px;
      color: #e0d8c3;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.8;
      resize: none;
      outline: none;
    }

    /* --- Haikus --- */
    .haiku-columns {
      display: flex;
      gap: 20px;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
    }

    .haiku-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .haiku-column h3 {
      color: #c5a059;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .haiku-card {
      width: 100%;
      max-width: 240px;
      height: 100px;
    }

    .haiku-card .card-side {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }

    .haiku-card .card-back {
      background-color: rgba(30, 30, 30, 0.95);
      border: 1px solid rgba(197, 160, 89, 0.6);
      color: #e0d8c3;
      line-height: 1.4;
    }

    /* --- Cartas --- */
    .deck-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      align-items: center;
      max-width: 1400px;
      padding: 20px 0;
      width: 100%;
    }

    .card-container {
      perspective: 1000px;
      position: relative;
      z-index: 1;
      cursor: pointer;
    }

    .card-container.bring-to-front {
      z-index: 10;
    }

    .card {
      width: 180px;
      height: 250px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s ease, scale 0.3s ease;
    }

    .card.zoom {
      transform: scale(1.6) rotateY(180deg);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 6px;
    }

    .card-front {
      background-image: url('images/Bonos/frontal.png');
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .card-info {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      padding: 10px;
      background-color: rgba(30, 30, 30, 0.9);
      color: white;
      border: 1px solid rgba(197, 160, 89, 0.6);
      border-radius: 6px;
      text-align: center;
      font-size: 11px;
      line-height: 1.3;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.6s, opacity 0.6s;
      z-index: 11;
      pointer-events: none;
    }

    .card-container.bring-to-front .card-info {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid rgba(197, 160, 89, 0.4);
        padding: 15px 10px;
      }

      .sidebar-nav {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
      }

      .nav-btn {
        padding: 8px 10px;
        font-size: 10px;
        flex: 1 1 calc(33% - 10px);
        text-align: center;
      }

      .character-container {
        grid-template-columns: 1fr;
      }

      .haiku-columns {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Barra Lateral -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="images/logoes.png" alt="Logo L5R">
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn active" onclick="switchTab('inicio')">🎲 Mesa de Dados</button>
      
      <div class="nav-group-title">Fichas</div>
      <button class="nav-btn" onclick="switchTab('char-kasai')">Kasai</button>
      <button class="nav-btn" onclick="switchTab('char-nite')">Nite</button>
      <button class="nav-btn" onclick="switchTab('char-takasi')">Takasi</button>
      <button class="nav-btn" onclick="switchTab('char-ukio')">Ukio</button>

      <div class="nav-group-title">Herramientas</div>
      <button class="nav-btn" onclick="switchTab('bonos')">Bonos</button>
      <button class="nav-btn" onclick="switchTab('hasimaru')">Hasimaru</button>
      <button class="nav-btn" onclick="switchTab('haikus')">Haikus</button>
      <button class="nav-btn" onclick="switchTab('notas')">Notas General</button>
    </nav>
  </aside>

  <!-- Área Principal -->
  <main class="main-content">

    <!-- PÁGINA PRINCIPAL: MESA COMÚN DE DADOS -->
    <section id="page-inicio" class="page-section active">
      <h1 class="table-title">Mesa de Tiradas en Tiempo Real</h1>
      
      <div class="players-grid" id="main-dice-grid">
        <!-- Generado dinámicamente con las fotos y datos de los jugadores y el Master -->
      </div>
    </section>

    <!-- PÁGINAS DE FICHAS INDIVIDUALES -->
    <section id="page-char-kasai" class="page-section">
      <div class="character-container" id="char-block-kasai"></div>
    </section>

    <section id="page-char-nite" class="page-section">
      <div class="character-container" id="char-block-nite"></div>
    </section>

    <section id="page-char-takasi" class="page-section">
      <div class="character-container" id="char-block-takasi"></div>
    </section>

    <section id="page-char-ukio" class="page-section">
      <div class="character-container" id="char-block-ukio"></div>
    </section>

    <!-- BONOS -->
    <section id="page-bonos" class="page-section">
      <div class="deck-container" id="deck-bonos"></div>
    </section>

    <!-- HASIMARU -->
    <section id="page-hasimaru" class="page-section">
      <div class="deck-container" id="deck-hasimaru"></div>
    </section>

    <!-- HAIKUS -->
    <section id="page-haikus" class="page-section">
      <div class="haiku-columns">
        <div class="haiku-column" id="haiku-col-1"><h3>Inicio</h3></div>
        <div class="haiku-column" id="haiku-col-2"><h3>Medio</h3></div>
        <div class="haiku-column" id="haiku-col-3"><h3>Final</h3></div>
      </div>
    </section>

    <!-- NOTAS GENERALES -->
    <section id="page-notas" class="page-section">
      <div class="notes-container">
        <h2>Bloc de Notas General</h2>
        <textarea id="samurai-notes" class="notes-textarea" placeholder="Escribe aquí las notas compartidas de la partida..."></textarea>
      </div>
    </section>

  </main>

  <!-- Módulo Firebase de Conexión en Tiempo Real -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAYf_qFkBwVxovQ4Sr_GMpdMaDSsTBRoY",
      authDomain: "leyenda-de-los-5-anillos.firebaseapp.com",
      databaseURL: "https://leyenda-de-los-5-anillos-default-rtdb.firebaseio.com",
      projectId: "leyenda-de-los-5-anillos",
      storageBucket: "leyenda-de-los-5-anillos.firebasestorage.app",
      messagingSenderId: "328710946580",
      appId: "1:328710946580:web:45ca44b42add62cd9a4c01"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Enviar tirada a Firebase al hacer clic
    window.saveRollToFirebase = function(charId, rollData) {
      const rollRef = ref(db, 'rolls/' + charId);
      set(rollRef, rollData);
    };

    // Escuchar actualizaciones en tiempo real para actualizar la mesa de todos
    charactersData.forEach(char => {
      const rollRef = ref(db, 'rolls/' + char.id);
      onValue(rollRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const totalEl = document.getElementById(`total-${char.id}`);
          if (totalEl) totalEl.innerText = data.totalSum;

          const historyBox = document.getElementById(`history-${char.id}`);
          if (historyBox) {
            if (historyBox.innerHTML.includes('Sin tiradas')) {
              historyBox.innerHTML = '';
            }
            const historyEntry = document.createElement('div');
            historyEntry.className = 'history-entry';
            historyEntry.innerHTML = `
              <strong>${data.numRoll}g${data.numKeep}:</strong> Total <span style="color:#55ff55;">${data.totalSum}</span>
              <br><span style="font-size:9px;">Dados: ${data.diceDetailsStr}</span>
            `;
            historyBox.prepend(historyEntry);
          }
        }
      });
    });
  </script>

  <script>
    // Datos de los Personajes + Director de Juego (Master)
    const charactersData = [
      { id: 'master', name: 'Master', img1: 'images/Master.png', isMaster: true },
      { id: 'kasai', name: 'Kasai', img1: 'images/Kasai1.png', img2: 'images/Kasai2.png' },
      { id: 'nite', name: 'Nite', img1: 'images/Nite1.png', img2: 'images/Nite2.png' },
      { id: 'takasi', name: 'Takasi', img1: 'images/Takasi1.png', img2: 'images/Takasi2.png' },
      { id: 'ukio', name: 'Ukio', img1: 'images/Ukio1.png', img2: 'images/Ukio2.png' }
    ];

    const bonosDeck = [
      { image: 'images/Bonos/Haikus.png', text: 'Haikus. Detalla la belleza de la poesía japonesa.' },
      { image: 'images/Bonos/termas.png', text: 'Descubre la relajación de las Termas, un lugar de tranquilidad y sanación ancestral.' },
      { image: 'images/Bonos/santuario Kitsune.png', text: 'Explora el misterioso Santuario Kitsune, hogar de los espíritus zorro legendarios.' }
    ];

    const hasimaruDeck = [
      { image: 'images/Hasimaru/Hasimaru1.png', text: 'Festival de Hasimaru.' },
      { image: 'images/Hasimaru/Hasimaru2.png', text: 'Hermansos Goro Y Boro, guardianes del templo.' },
      { image: 'images/Hasimaru/Hasimaru3.png', text: 'El origen del los Kami.' },
      { image: 'images/Hasimaru/Hasimaru4.png', text: 'Duelista estrella.' },
      { image: 'images/Hasimaru/Hasimaru5.png', text: 'Poeta.' },
      { image: 'images/Hasimaru/Hasimaru6.png', text: 'Sabotaje.' },
      { image: 'images/Hasimaru/Hasimaru7.png', text: 'Bebida envenenada.' },
      { image: 'images/Hasimaru/Hasimaru8.png', text: 'Cultivos secretos.' },
      { image: 'images/Hasimaru/Hasimaru9.png', text: 'Takezo.' },
      { image: 'images/Hasimaru/Hasimaru10.png', text: 'Akodo Masaru.' }
    ];

    const haikuParts = {
      col1: ["Bajo el cerezo", "El viento frío", "Hoja de acero"],
      col2: ["florece la mañana", "susurra entre los pinos", "brilla bajo la luna"],
      col3: ["en silencio.", "sin descanso.", "con honor."]
    };

    // Renderizar la mesa principal con los jugadores y el Master
    function renderMainTable() {
      const grid = document.getElementById('main-dice-grid');
      grid.innerHTML = '';

      charactersData.forEach(char => {
        const card = document.createElement('div');
        card.className = `player-card ${char.isMaster ? 'master-card' : ''}`;
        card.innerHTML = `
          <img src="${char.img1}" alt="${char.name}" class="player-avatar" onerror="this.src='images/icono.png';">
          <div class="player-name">${char.name}</div>

          <div class="dice-roller-box">
            <div class="dice-inputs">
              <div class="input-group">
                <label>Tirar</label>
                <input type="number" id="roll-num-${char.id}" class="dice-input" value="5" min="1" max="20">
              </div>
              <div class="input-group">
                <label>Guardar</label>
                <input type="number" id="keep-num-${char.id}" class="dice-input" value="2" min="1" max="20">
              </div>
            </div>

            <button class="roll-btn" onclick="rollL5RDice('${char.id}')">🎲 Lanzar Dados</button>

            <div class="dice-result-total">
              <div style="font-size:9px; color:#aaa; text-transform:uppercase;">Resultado</div>
              <div class="total-number" id="total-${char.id}">0</div>
            </div>

            <div class="dice-history" id="history-${char.id}">
              <div style="color:#777; font-style:italic;">Sin tiradas aún.</div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Renderizar las fichas individuales (solo jugadores)
    function initCharacters() {
      charactersData.filter(char => !char.isMaster).forEach(char => {
        const container = document.getElementById(`char-block-${char.id}`);
        if (!container) return;

        container.innerHTML = `
          <h2 class="char-title">${char.name}</h2>
          <div class="char-gallery">
            <div class="char-img-wrapper">
              <img src="${char.img1}" alt="${char.name} 1" onerror="this.src='images/icono.png';">
            </div>
            <div class="char-img-wrapper">
              <img src="${char.img2}" alt="${char.name} 2" onerror="this.src='images/icono.png';">
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            <label style="color:#c5a059; font-weight:bold;">FICHA Y NOTAS DE ${char.name.toUpperCase()}:</label>
            <textarea id="desc-${char.id}" class="char-textarea" placeholder="Datos, ventajas o historial del personaje..."></textarea>
          </div>
        `;

        const descArea = document.getElementById(`desc-${char.id}`);
        descArea.value = localStorage.getItem(`desc_${char.id}`) || '';
        descArea.addEventListener('input', () => {
          localStorage.setItem(`desc_${char.id}`, descArea.value);
        });
      });
    }

    // Lógica del sistema XgY para Leyenda de los Cinco Anillos
    function rollL5RDice(charId) {
      const rollNumInput = document.getElementById(`roll-num-${charId}`);
      const keepNumInput = document.getElementById(`keep-num-${charId}`);
      
      let numRoll = parseInt(rollNumInput.value) || 1;
      let numKeep = parseInt(keepNumInput.value) || 1;

      if (numKeep > numRoll) numKeep = numRoll;

      let diceResults = [];

      for (let i = 0; i < numRoll; i++) {
        let singleDieTotal = 0;
        let rollsExploded = [];
        let rollVal = 0;

        do {
          rollVal = Math.floor(Math.random() * 10) + 1;
          singleDieTotal += rollVal;
          rollsExploded.push(rollVal);
        } while (rollVal === 10);

        diceResults.push({
          finalTotal: singleDieTotal,
          breakdown: rollsExploded
        });
      }

      diceResults.sort((a, b) => b.finalTotal - a.finalTotal);

      let keptDice = diceResults.slice(0, numKeep);
      let totalSum = keptDice.reduce((acc, d) => acc + d.finalTotal, 0);

      let diceDetailsStr = diceResults.map((d, idx) => {
        let isKept = idx < numKeep;
        let rollText = d.breakdown.length > 1 ? `[${d.breakdown.join('+')}=${d.finalTotal}]` : `${d.finalTotal}`;
        
        if (d.breakdown.includes(10)) {
          rollText = `<span class="exploded">${rollText}💥</span>`;
        }
        
        return isKept ? `<span class="kept-dice">${rollText}</span>` : `<span style="opacity:0.4">${rollText}</span>`;
      }).join(', ');

      if (typeof window.saveRollToFirebase === 'function') {
        window.saveRollToFirebase(charId, {
          numRoll,
          numKeep,
          totalSum,
          diceDetailsStr,
          timestamp: Date.now()
        });
      }
    }

    // Barajar
    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[i], copy[j]];
      }
      return copy;
    }

    function renderDeck(containerId, deckData, shouldShuffle = false, isHasimaru = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = ''; 
      const deckToRender = shouldShuffle ? shuffleArray(deckData) : deckData;

      deckToRender.forEach((cardData) => {
        const cardContainer = document.createElement('div');
        cardContainer.className = 'card-container';
        cardContainer.innerHTML = `
          <div class="card">
            <div class="card-side card-front"></div>
            <div class="card-side card-back" style="background-image: url('${cardData.image}');"></div>
          </div>
          <div class="card-info"><p>${cardData.text}</p></div>
        `;

        cardContainer.addEventListener('click', () => {
          const card = cardContainer.querySelector('.card');
          if (isHasimaru) {
            card.classList.toggle('flipped');
            cardContainer.classList.toggle('bring-to-front');
          } else {
            const isZoomed = card.classList.contains('zoom');
            container.querySelectorAll('.card-container').forEach(other => {
              other.querySelector('.card').classList.remove('zoom');
              other.classList.remove('bring-to-front');
            });
            if (!isZoomed) {
              card.classList.add('zoom');
              cardContainer.classList.add('bring-to-front');
            }
          }
        });

        container.appendChild(cardContainer);
      });
    }

    function renderHaikus() {
      ['col1', 'col2', 'col3'].forEach((colKey, index) => {
        const container = document.getElementById(`haiku-col-${index + 1}`);
        container.querySelectorAll('.card-container').forEach(el => el.remove());

        haikuParts[colKey].forEach((text) => {
          const cardContainer = document.createElement('div');
          cardContainer.className = 'card-container haiku-card';
          cardContainer.innerHTML = `
            <div class="card" style="width:100%; height:100%;">
              <div class="card-side card-front"></div>
              <div class="card-side card-back">${text}</div>
            </div>
          `;

          cardContainer.addEventListener('click', () => {
            cardContainer.querySelector('.card').classList.toggle('flipped');
          });

          container.appendChild(cardContainer);
        });
      });
    }

    // Cambiar Pestañas
    function switchTab(tabName) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));

      const activeSection = document.getElementById(`page-${tabName}`);
      if (activeSection) activeSection.classList.add('active');

      const activeBtn = Array.from(document.querySelectorAll('.nav-btn')).find(btn => 
        btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(tabName)
      );
      if (activeBtn) activeBtn.classList.add('active');

      if (tabName === 'bonos') renderDeck('deck-bonos', bonosDeck, true, false);
      else if (tabName === 'hasimaru') renderDeck('deck-hasimaru', hasimaruDeck, false, true);
      else if (tabName === 'haikus') renderHaikus();
    }

    // Inicio
    window.addEventListener('DOMContentLoaded', () => {
      renderMainTable();
      initCharacters();
      renderDeck('deck-bonos', bonosDeck, true, false);
      renderDeck('deck-hasimaru', hasimaruDeck, false, true);
      renderHaikus();

      const notesArea = document.getElementById('samurai-notes');
      if (notesArea) {
        notesArea.value = localStorage.getItem('leyenda_notas') || '';
        notesArea.addEventListener('input', () => {
          localStorage.setItem('leyenda_notas', notesArea.value);
        });
      }
    });
  </script>
